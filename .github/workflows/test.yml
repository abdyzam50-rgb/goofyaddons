name: Validate traders and calculator
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash ./gradlew --no-daemon --max-workers=3 build calculatorIntegrationTest
      - run: node --test tools/bazaar-calc/*.test.mjs
