name: Tests

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:

# A newer push to the same PR or branch cancels the older run.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The viz module draws with Java2D; no display on the runner.
      JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Trading foundation compiles with the client JDK and targets Java 21 APIs.
          java-version: |
            25
            21

      # Caches the Gradle distribution, dependencies and build cache between runs.
      - uses: gradle/actions/setup-gradle@v4

      # Maven Central sometimes answers 429, so fetch dependencies and compile with retries
      # before running the tests once.
      - name: Compile
        run: |
          for attempt in 1 2 3; do
            ./gradlew testClasses && exit 0
            echo "Compile attempt $attempt failed; retrying in $((attempt * 20)) s"
            sleep $((attempt * 20))
          done
          exit 1

      - name: Test
        run: ./gradlew check

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '*/build/reports/tests/test/'
          retention-days: 7

  # The trace recorder mod is its own Gradle build, so the tests above never download
  # Minecraft. This job checks that it still compiles against the shared movement code.
  client-mod:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Minecraft 26 needs Java 25 to compile against; Gradle itself runs on 21 (the
          # last one listed is the default).
          java-version: |
            25
            21

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: gradle/actions/setup-gradle@v4

      - name: Test Discord controls and companion integration
        run: node --test tools/bazaar-calc/discord-control.test.mjs tools/bazaar-calc/adapter.test.mjs tools/bazaar-calc/data-paths.test.mjs tools/bazaar-calc/community.test.mjs

      - name: Build the client mod
        run: |
          for attempt in 1 2 3; do
            ./gradlew -p client test calculatorIntegrationTest build && exit 0
            echo "Build attempt $attempt failed; retrying in $((attempt * 20)) s"
            sleep $((attempt * 20))
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: astar-goofyaddons-26.3
          path: client/build/libs/*.jar
